# Hourly Fly sandbox cost controls:
#   - reclaim idle machines past expires_at
#   - upsert daily sandbox_usage (machine-hours per tenant)
#   - warn when projected monthly spend exceeds FLY_MONTHLY_SPEND_WARNING_USD
#
# Required GitHub secrets:
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   FLY_API_TOKEN
#   FLY_APP_NAME
#   FLY_SANDBOX_IMAGE
#
# Optional secrets / vars:
#   FLY_API_HOSTNAME
#   FLY_SANDBOX_HOURLY_RATE_USD
#   FLY_MONTHLY_SPEND_WARNING_USD
#   FLY_MAX_ACTIVE_SANDBOXES_PER_TENANT

name: Sandbox cost controls

on:
  schedule:
    # Hourly — reclaim idle VMs promptly; usage rollup is idempotent.
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run sandbox cost controls
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
          FLY_SANDBOX_IMAGE: ${{ secrets.FLY_SANDBOX_IMAGE }}
          FLY_API_HOSTNAME: ${{ secrets.FLY_API_HOSTNAME }}
          FLY_SANDBOX_HOURLY_RATE_USD: ${{ secrets.FLY_SANDBOX_HOURLY_RATE_USD }}
          FLY_MONTHLY_SPEND_WARNING_USD: ${{ secrets.FLY_MONTHLY_SPEND_WARNING_USD }}
          FLY_MAX_ACTIVE_SANDBOXES_PER_TENANT: ${{ secrets.FLY_MAX_ACTIVE_SANDBOXES_PER_TENANT }}
        run: npm run sandbox:cost-controls
        if: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' && secrets.FLY_API_TOKEN != '' && secrets.FLY_APP_NAME != '' && secrets.FLY_SANDBOX_IMAGE != '' }}

      - name: Skipped (missing secrets)
        run: echo "Skipping sandbox cost controls — set Supabase + Fly secrets to enable"
        if: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL == '' || secrets.SUPABASE_SERVICE_ROLE_KEY == '' || secrets.FLY_API_TOKEN == '' || secrets.FLY_APP_NAME == '' || secrets.FLY_SANDBOX_IMAGE == '' }}
