# Hourly zero-cost uptime check against the production health endpoint.
#
# Required repository variable (Settings → Secrets and variables → Actions → Variables):
#   UPTIME_URL — full health URL, e.g. https://cyberskill-builder.vercel.app/api/health
#
# Optional: use a repository secret named UPTIME_URL instead (vars take precedence below
# only when set; secrets.UPTIME_URL is the fallback).
name: Uptime

on:
  schedule:
    # Every hour at minute 0 (UTC)
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit health endpoint
        env:
          UPTIME_URL: ${{ vars.UPTIME_URL || secrets.UPTIME_URL }}
        run: |
          set -euo pipefail
          if [ -z "${UPTIME_URL:-}" ]; then
            echo "::error::UPTIME_URL is not set. Add a repository variable (or secret) named UPTIME_URL, e.g. https://cyberskill-builder.vercel.app/api/health"
            exit 1
          fi
          echo "Checking: ${UPTIME_URL}"
          http_code="$(curl -sS -o /tmp/uptime-body.txt -w '%{http_code}' \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            -H 'Accept: application/json' \
            "$UPTIME_URL")"
          echo "HTTP status: ${http_code}"
          if [ -f /tmp/uptime-body.txt ]; then
            echo "Body:"
            head -c 2048 /tmp/uptime-body.txt || true
            echo
          fi
          if [ "$http_code" != "200" ]; then
            echo "::error::Health check failed (expected HTTP 200, got ${http_code})"
            exit 1
          fi
          echo "Health check OK"

  route-smoke:
    needs: health-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Load authenticated production routes
        env:
          UPTIME_SMOKE_URL: ${{ vars.UPTIME_SMOKE_URL }}
          UPTIME_TEST_EMAIL: ${{ secrets.UPTIME_TEST_EMAIL }}
          UPTIME_TEST_PASSWORD: ${{ secrets.UPTIME_TEST_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
        run: npm run smoke:uptime
