name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: RLS coverage
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run test:rls
        if: ${{ secrets.DATABASE_URL != '' }}

      - name: RLS coverage (skipped)
        run: echo "Skipping RLS coverage — set DATABASE_URL GitHub secret to enable"
        if: ${{ secrets.DATABASE_URL == '' }}
